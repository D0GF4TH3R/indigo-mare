    font-family:'Cormorant Garamond',serif;
    font-weight:500;font-size:clamp(46px,15vw,78px);

    font-size:clamp(16px,4.6vw,20px);letter-spacing:.16em;

    text-shadow:0 1px 8px rgba(0,0,0,.5);
  }

  .controls{
    position:sticky;top:0;z-index:20;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    background:linear-gradient(180deg,var(--paper) 60%,rgba(16,24,43,.7));
    padding:14px 18px 8px;
    border-bottom:1px solid var(--line);

  #search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,200,120,.16)}

  .tab{
    flex:0 0 auto;font-family:'EB Garamond',serif;font-size:16px;
    padding:7px 14px 9px;cursor:pointer;white-space:nowrap;
    background:none;border:none;color:var(--soft);
    border-bottom:2px solid transparent;transition:.18s;letter-spacing:.01em;

  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:500}

    scroll-margin-top:140px;
  }
  .group::after{content:"";flex:1;height:1px;background:var(--line)}

  .card{
    background:var(--glass);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    border:1px solid rgba(200,210,230,.14);
    border-radius:16px;box-shadow:var(--shadow);
    padding:20px 20px 18px;margin-bottom:14px;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--gold);opacity:.7;
  }
  .card.sea::before{background:var(--sea)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .card h3{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:24px;line-height:1.12;letter-spacing:.005em;color:#f4f6fa;
  }
  .kicker{

  .card .meta{
    font-style:italic;font-size:15px;color:var(--rose-deep);margin-top:3px;
  }
  .card p{font-size:16.5px;color:#dce1ec;margin-top:10px;line-height:1.5}
  .card .tip{
    font-size:14.5px;color:var(--soft);margin-top:11px;
    padding:9px 13px;background:rgba(232,200,120,.1);border-radius:9px;
  }
  .card .tip b{color:var(--gold);font-weight:600}
  .card .links{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
  .btn{
    font-family:'EB Garamond',serif;font-size:15px;font-weight:500;
    text-decoration:none;padding:9px 16px;border-radius:10px;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;letter-spacing:.01em;
  }
  .btn-map{background:var(--gold);color:#1a2238}
  .btn-map:hover{background:#f0d590}
  .btn-link{background:rgba(143,176,168,.16);color:var(--sage-deep);border:1px solid rgba(143,176,168,.3)}
  .btn-link:hover{background:rgba(143,176,168,.26)}
  .btn-wa{background:#3f9d77;color:#fdfcf8}
  .btn-wa:hover{background:#46ad84}
  .btn-wa svg{width:17px;height:17px}
  .btn svg{width:16px;height:16px}

  .empty{text-align:center;color:var(--soft);font-style:italic;padding:54px 20px;font-size:17px}

  footer{
    text-align:center;color:var(--soft);font-size:14px;
    padding:30px 24px;line-height:1.8;position:relative;z-index:1;
  }
  footer .fleur{color:var(--gold);font-size:18px;display:block;margin-bottom:6px}
  footer .names{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--sage-deep)}

const KATEGORIEN = ["Programm","Transport","Hotels","Restaurants","Strände","Ausflüge","Aktivitäten"];
let aktiv = "Programm";
const tabsEl=document.getElementById("tabs"), listEl=document.getElementById("list"),
      countEl=document.getElementById("count"), searchEl=document.getElementById("search");

KATEGORIEN.forEach(k=>{
  const b=document.createElement("button");
  b.className="tab"+(k==="Programm"?" active":""); b.textContent=k;
  b.onclick=()=>{aktiv=k;[...tabsEl.children].forEach(c=>c.classList.remove("active"));b.classList.add("active");render();};
  tabsEl.appendChild(b);
});

  if(t==="wa") return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.69 8.24-8.23 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43l-.48-.01c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"/></svg>';

function cardHTML(d){
  return `
    <div class="card${d.sea?' sea':''}">
      <div class="top">
        <h3>${esc(d.name)}</h3>
        <span class="kicker">${esc(d.gruppe||d.kategorie)}</span>
      </div>
      ${d.info?`<div class="meta">${esc(d.info)}</div>`:""}
      <p>${esc(d.text)}</p>
      ${d.tip?`<div class="tip">${d.tip}</div>`:""}
      ${(d.maps||d.link)?`<div class="links">
        ${d.maps?`<a class="btn btn-map" href="${d.maps}" target="_blank" rel="noopener">${icon("map")} Auf Karte</a>`:""}
        ${d.link?`<a class="btn ${d.linkstyle==="whatsapp"?"btn-wa":"btn-link"}" href="${d.link}" target="_blank" rel="noopener">${icon(d.linkstyle==="whatsapp"?"wa":"link")} ${esc(d.linklabel||"Öffnen")}</a>`:""}
      </div>`:""}
    </div>`;
}

function render(){
  const q=searchEl.value.trim().toLowerCase();
  const treffer=DATEN.filter(d=>{
    const katOk=d.kategorie===aktiv;
    const txtOk=!q||(d.name+" "+(d.info||"")+" "+d.text+" "+(d.tip||"")+" "+d.kategorie+" "+(d.gruppe||"")).toLowerCase().includes(q);
    return katOk&&txtOk;
  });
  countEl.textContent=treffer.length===0?"":treffer.length+(treffer.length===1?" Eintrag":" Einträge");
  if(treffer.length===0){listEl.innerHTML='<div class="empty">Nichts gefunden.<br>Versuch ein anderes Wort oder eine andere Kategorie.</div>';return;}

  // Kategorien mit Untergruppen: Zwischenüberschriften statt flacher Liste
  const GRUPPEN = {
    "Restaurants": ["Mittags","Abends","Bars & Beach Clubs"],
    "Aktivitäten": ["Sport vor Ort","Auf dem Wasser","Natur & Abenteuer","Wein & Kultur"]
  };
  if(GRUPPEN[aktiv] && !q){
    let html="";
    GRUPPEN[aktiv].forEach(g=>{
      const teil=treffer.filter(d=>d.gruppe===g);
      if(teil.length){
        const titel = (g==="Mittags"||g==="Abends") ? g+" essen" : g;
        html+=`<div class="group">${titel}</div>`+teil.map(cardHTML).join("");
      }
    });
    listEl.innerHTML=html;
  } else {
    listEl.innerHTML=treffer.map(cardHTML).join("");
  }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
searchEl.addEventListener("input",render);
render();
</script>
</body>
</html>
