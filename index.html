  /* sanfter Verlauf, damit Inhalt unten lesbar bleibt */
  .bg::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,
      rgba(220,231,236,0) 0%,
      rgba(244,240,231,0) 32%,
      rgba(247,243,234,.55) 52%,
      rgba(249,245,237,.92) 70%,
      var(--paper) 86%);
  }

  /* ---------- Titel im Himmel ---------- */
  .hero{
    text-align:center;
    padding:clamp(40px,11vh,90px) 24px clamp(20px,5vh,40px);
    padding-top:calc(env(safe-area-inset-top,0) + clamp(40px,11vh,90px));
  }
  .hero .eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-size:clamp(17px,4.5vw,21px);
    letter-spacing:.04em;color:var(--sage-deep);
    margin-bottom:6px;
  }
  .hero h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;font-size:clamp(46px,15vw,78px);
    line-height:.96;letter-spacing:.005em;color:#41513f;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .hero .rule{
    width:46px;height:1px;background:var(--gold);
    margin:18px auto 14px;opacity:.8;
  }
  .hero .date{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(16px,4.6vw,20px);letter-spacing:.16em;
    text-transform:uppercase;color:#54604d;
  }
  .hero .place{
    font-style:italic;font-size:15px;color:var(--sage-deep);margin-top:6px;
  }

  /* ---------- Steuerung ---------- */
  .controls{
    position:sticky;top:0;z-index:20;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    background:linear-gradient(180deg,var(--paper) 60%,rgba(251,247,239,.7));
    padding:14px 18px 8px;
    border-bottom:1px solid var(--line);
  }
  .searchwrap{position:relative;max-width:620px;margin:0 auto}
  .searchwrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--soft)}
  #search{
    width:100%;font-family:'EB Garamond',serif;font-size:17px;
    padding:13px 16px 13px 44px;
    border:1px solid var(--line);border-radius:12px;
    background:#fff;color:var(--ink);
    box-shadow:inset 0 1px 2px rgba(67,70,60,.04);
  }
  #search::placeholder{color:#aaa493;font-style:italic}
  #search:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(124,138,108,.12)}

  .tabs{display:flex;gap:4px;overflow-x:auto;padding:11px 2px 3px;max-width:620px;margin:0 auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;font-family:'EB Garamond',serif;font-size:16px;
    padding:7px 14px 9px;cursor:pointer;white-space:nowrap;
    background:none;border:none;color:var(--soft);
    border-bottom:2px solid transparent;transition:.18s;letter-spacing:.01em;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--sage-deep);border-bottom-color:var(--gold);font-weight:500}

  /* ---------- Liste ---------- */
  main{max-width:620px;margin:0 auto;padding:14px 18px 8px;position:relative;z-index:1}
  .count{font-style:italic;font-size:14.5px;color:var(--soft);padding:2px 2px 14px}
  .group{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:22px;color:var(--sage-deep);
    margin:6px 4px 12px;display:flex;align-items:center;gap:12px;
    scroll-margin-top:140px;
  }
  .group::after{content:"";flex:1;height:1px;background:var(--line)}

  .card{
    background:var(--glass);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(228,220,201,.9);
    border-radius:16px;box-shadow:var(--shadow);
    padding:20px 20px 18px;margin-bottom:14px;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--sage);opacity:.5;
  }
  .card.sea::before{background:var(--sea)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .card h3{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:24px;line-height:1.12;letter-spacing:.005em;color:#3e4839;
  }
  .kicker{
    flex:0 0 auto;font-family:'EB Garamond',serif;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--soft);
    padding-top:5px;
  }
  .card .meta{
    font-style:italic;font-size:15px;color:var(--rose-deep);margin-top:3px;
  }
  .card p{font-size:16.5px;color:#4d5044;margin-top:10px;line-height:1.5}
  .card .tip{
    font-size:14.5px;color:var(--soft);margin-top:11px;
    padding:9px 13px;background:rgba(228,220,201,.28);border-radius:9px;
  }
  .card .tip b{color:var(--sage-deep);font-weight:600}
  .card .links{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
  .btn{
    font-family:'EB Garamond',serif;font-size:15px;font-weight:500;
    text-decoration:none;padding:9px 16px;border-radius:10px;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;letter-spacing:.01em;
  }
  .btn-map{background:var(--sage);color:#fdfcf8}
  .btn-map:hover{background:var(--sage-deep)}
  .btn-link{background:rgba(124,138,108,.12);color:var(--sage-deep);border:1px solid rgba(124,138,108,.25)}
  .btn-link:hover{background:rgba(124,138,108,.2)}
  .btn-wa{background:#4a8a6f;color:#fdfcf8}
  .btn-wa:hover{background:#3f7a61}
  .btn-wa svg{width:17px;height:17px}
  .btn svg{width:16px;height:16px}

  .empty{text-align:center;color:var(--soft);font-style:italic;padding:54px 20px;font-size:17px}

  footer{
    text-align:center;color:var(--soft);font-size:14px;
    padding:30px 24px;line-height:1.8;position:relative;z-index:1;
  }
  footer .fleur{color:var(--gold);font-size:18px;display:block;margin-bottom:6px}
  footer .names{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--sage-deep)}
</style>
</head>
<body>

<div class="bg"></div>

<div class="hero">
  <div class="eyebrow">La Grande Fête</div>
  <h1>Nuit Indigo&nbsp;Mare</h1>
  <div class="rule"></div>
  <div class="date">4.–5. Juli 2026</div>
  <div class="place">Casa Indigo Mare · Golf von Ajaccio, Korsika</div>
</div>

<div class="controls">
  <div class="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Suchen … z. B. Hummer, Strand, Padel, Boot" autocomplete="off">
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<footer>
  <span class="fleur">✦</span>
  Mit Liebe für unsere Gäste<br>
  Fragen? Findet ihr oben unter „Programm“<br>
  <span class="names">Susanne Bergmann &amp; Amélie Bonnet</span>
</footer>

<script>
const ORT_MAPS = "https://maps.app.goo.gl/9VHoyo2LRmnLKrsNA";
const M = q => "https://maps.google.com/?q="+encodeURIComponent(q);

const DATEN = [
  { kategorie:"Programm", name:"Nuit Indigo Mare", info:"Samstag, 4. Juli 2026 · 19.00 Uhr",
    text:"Der große Abend bei Casa Indigo Mare. Dresscode: summer elegance.",
    tip:"<b>Location:</b> bei Google Maps einfach „Casa Indigo Mare“ eingeben — oder hier auf die Karte tippen.",
    maps:ORT_MAPS },
  { kategorie:"Programm", name:"Brunch & Beach", info:"Sonntag, 5. Juli 2026 · ab 12.30 Uhr",
    text:"Entspannter Ausklang am Tag danach. Kommt locker, wie ihr mögt.",
    maps:ORT_MAPS },
  { kategorie:"Programm", name:"WhatsApp-Gruppe", info:"Alle Infos & Updates an einem Ort",
    text:"Tretet unserer Gruppe „La Grande Fête · Nuit Indigo Mare“ bei – hier teilen wir kurzfristige Infos, Treffpunkte und Fotos. Einfach auf den Link tippen.",
    link:"https://chat.whatsapp.com/L8vj8bXDtGP9WBig48IWEm", linklabel:"Gruppe beitreten", linkstyle:"whatsapp" },
  { kategorie:"Programm", name:"Kontakt für Rückfragen", info:"Wir helfen gern weiter",
    text:"Bei Fragen rund ums Fest erreicht ihr Susanne Bergmann (s.bergmann@ffburda.de · +49 7221 21 02 31) und Amélie Bonnet (a.bonnet@ffburda.de · +49 7221 21 02 33).",
    link:"mailto:s.bergmann@ffburda.de,a.bonnet@ffburda.de?subject=Nuit%20Indigo%20Mare%20%E2%80%93%20Frage", linklabel:"Mail schreiben" },

  { kategorie:"Restaurants", gruppe:"Mittags", name:"Paillote Casa Médéa", info:"4,9 ★ · Plage de Cala Médéa · €€",
    text:"Direkt am Strand, Tische mit freiem Blick aufs türkise Meer. Frische hausgemachte Gerichte wie gegrillte Garnelen und der korsische Burger, herzlicher Service, entspannte Sonnenatmosphäre.",
    tip:"<b>Tipp:</b> sehr beliebt – am besten vormittags (9.30–12 Uhr) reservieren.",
    maps:M("Paillote Casa Médéa Cala Médéa Corse") },
  { kategorie:"Restaurants", gruppe:"Mittags", name:"Paillotte du Rupione", info:"4,6 ★ · Plage du Rupione · €€",
    text:"Charmante Paillote mit den Füßen quasi im Wasser. Großzügige Portionen, frische mediterran-korsische Küche von Steak bis Salat, Barfuß-im-Sand-Ambiente, gutes Preis-Leistungs-Verhältnis.",
    maps:M("Paillotte du Rupione Corse") },
  { kategorie:"Restaurants", gruppe:"Mittags", name:"La Plage d’Argent", info:"4,4 ★ · Mare e Sole · ca. 30–40 € p. P.",
    text:"Traumhafte Lage am langen Sandstrand mit weitem Meerblick. Gelobt: hausgemachter Burger, Lammhaxe, ausgezeichnetes Rinder-Tatar, Wurstplatten mit lokalen Spezialitäten und frischer Fisch.",
    maps:M("La Plage d'Argent Mare e Sole Corse") },

  { kategorie:"Restaurants", gruppe:"Abends", name:"Le Maquis – L’Arbousier", info:"Porticcio · 5-Sterne-Hotel · gehoben",
    text:"Das gastronomische Restaurant des Hotels Le Maquis, praktisch vor der Haustür. Traumhafte Terrasse mit Blick über die Bucht bis zu den Îles Sanguinaires, feine mediterran-korsische Küche, aufmerksamer Service. Mittags wie abends ein Genuss.",
    tip:"<b>Tipp:</b> Hotelrestaurant – unbedingt früh reservieren, ein Tisch für externe Gäste ist nicht immer garantiert. Nur wenige Minuten entfernt.",
    maps:M("Le Maquis Porticcio Corse") },
  { kategorie:"Restaurants", gruppe:"Abends", name:"Villa Cala Médéa", info:"4,4 ★ · Rond-Point de l’Isolella · €€€",
    text:"Die elegantere Adresse mit traumhafter Terrasse und Meerblick, zum Sonnenuntergang besonders romantisch. Warme, stimmungsvolle Atmosphäre, aufmerksamer Service, großzügige Küche mit Fisch und Fleisch – perfekt für einen besonderen Abend.",
    maps:M("Villa Cala Médéa Isolella Corse") },
  { kategorie:"Restaurants", gruppe:"Abends", name:"Le Bilboq „Chez Jean-Jean“", info:"Ajaccio Altstadt · gehoben",
    text:"Institution in den Gassen der Altstadt, nahe der Place Foch. Alles dreht sich um ein Gericht: die legendäre Hummerpasta (Spaghetti à la langouste). Wirt Jean-Jean singt zur Begrüßung Klassiker in der Gasse – urig und herzlich. Perfekt zum Abschluss eines Ajaccio-Tages.",
    tip:"<b>Tipp:</b> ab Porticcio 20–25 Min. Unbedingt reservieren; oft nur Barzahlung, v. a. in der Hummer-Saison geöffnet – vorher anrufen.",
    maps:M("Le Bilboq Ajaccio") },
  { kategorie:"Restaurants", gruppe:"Abends", name:"Auberge U Sciatellu „Chez Séraphin“", info:"Peri · 4,8 ★ · festes Menü",
    text:"Rustikales, urig-authentisches Bergwirtshaus – für viele „das wahre Korsika“. Festes, mehrgängiges korsisches Menü aus lokalen, saisonalen Zutaten, herzlicher familiärer Empfang, traumhafte Höhenlage (über 2.000 Bewertungen).",
    tip:"<b>Tipp:</b> ab Porticcio 40–45 Min. über eine kurvige, grandiose Bergstraße. Reservierung empfohlen, Menü v. a. abends.",
    maps:M("Auberge U Sciatellu Peri Corse") },
  { kategorie:"Restaurants", gruppe:"Abends", name:"Agnarellu Plage", info:"Lieu-dit Agnarellu · €€ · Sundowner",
    text:"Strandlage mit den Füßen im Sand, herzlicher Empfang, schöne Weinauswahl, großer Holzkohle-Grill. Großartiger Sonnenuntergang und sublime Aussicht – ideal für Drinks am Abend und langsames Genießen.",
    tip:"<b>Tipp:</b> Fleisch kommt gern eine Spur zu durch – eine Garstufe niedriger bestellen. Etwas Geduld: der Grillmeister arbeitet allein.",
    maps:M("Agnarellu Plage Corse") },

  { kategorie:"Strände", sea:true, name:"Plage A Stagnola", info:"unser Hausstrand · sehr lang",
    text:"Langgestreckter Sandstrand an der Isolella-Spitze, von Felsen gesäumt, kristallklares Wasser – ideal zum Schnorcheln, kleine Fische direkt am Ufer. Geschützt vor Dünung, mehrere Zugänge, sympathischer Strand-Snack mit guter Küche.",
    tip:"<b>Tipp:</b> kostenlose Parkplätze, sehr gute Badewasserqualität.",
    maps:M("Plage A Stagnola Isolella Corse") },
  { kategorie:"Strände", sea:true, name:"Plage de la Medea", info:"klein & fein · Geheimtipp",
    text:"Kleine, ruhige Bucht mit feinem, leicht rosa schimmerndem Sand, selbst in der Saison angenehm leer. Klares Wasser, zwei Strandkneipen direkt am Sand.",
    tip:"<b>Tipp:</b> großer kostenloser Parkplatz, Supermarkt in der Nähe, im Sommer Bootsverleih.",
    maps:M("Plage de la Medea Corse") },
  { kategorie:"Strände", sea:true, name:"Plage du Ruppione", info:"Surfer-Feeling",
    text:"Rund 600 m feiner weißer Sand und türkises Wasser, von Felsen eingerahmt – früh morgens fast für sich allein. An windigen Tagen beliebter Surf-Spot mit lässigem Flair.",
    tip:"<b>Tipp:</b> Parkplätze & Supermarkt nahe, Strandbar, Verleih von Kajaks und SUP.",
    maps:M("Plage du Ruppione Corse") },
  { kategorie:"Strände", sea:true, name:"Plage de Mare é Sole", info:"4,7 ★ · Traumstrand",
    text:"Weitläufiger Traumstrand, einhellig als „Paradies“ gefeiert – ultrafeiner, fast silberweißer Sand und leuchtend türkises Wasser. Dank Pinienwald wild und ursprünglich.",
    tip:"<b>Tipp:</b> kostenlose Parkplätze, schattige Strandbar. Kein Supermarkt nahe – Verpflegung mitnehmen.",
    maps:M("Plage de Mare e Sole Corse") },
  { kategorie:"Strände", sea:true, name:"Agosta Plage", info:"ewig lang · Wassersport",
    text:"Endlos langer, rund 2 km weiter Strand mit feinem hellem Sand im Süden des Golfs. Lebhaftes Zentrum mit Restaurants, ruhigeres wildes Nordende – für jeden das passende Plätzchen.",
    tip:"<b>Tipp:</b> Wassersport über „Agosta Fun Beach“: Jetski, Parasailing, Bananenboot, SUP, Tretboote, Beachvolleyball, Kitesurf-Bereich. Duschen, WC, Liegenverleih.",
    maps:M("Agosta Plage Corse") },

  { kategorie:"Ausflüge", name:"Sanguinaires & Altstadt Ajaccio", info:"Tagesausflug",
    text:"Alles an einem Tag: dramatische Küste, Strandclub-Feeling, napoleonische Altstadt. Vormittags zur Pointe de la Parata (20 Min. Küstenpfad zum Genueserturm, Panoramablick auf die Îles Sanguinaires). Mittags KOS Beach Club an der Route des Sanguinaires. Nachmittags Altstadt Ajaccio: Maison Bonaparte, Place Foch, Markt, Kathedrale, Hafen, Zitadelle.",
    tip:"<b>Tipp:</b> zum Sonnenuntergang glühen die „blutroten“ Felsen der Sanguinaires – einer der schönsten Sonnenuntergänge Korsikas. Abends Hummerpasta im „Le Bilboq“.",
    maps:M("Pointe de la Parata Ajaccio") },
  { kategorie:"Ausflüge", name:"Lac de Tolla", info:"grünes Hinterland · Baden",
    text:"Durch das Prunelli-Tal hinauf zum türkisblauen Lac de Tolla, dem größten See Korsikas – klar, kühl, erfrischend. Lunch in der Paillote A Fiuminala (4,9 ★) direkt am Ufer: Moules-frites, Thunfisch, Burger, gute Cocktails. Baden & Wassersport über das Centre Nautique de Tolla (Juni–Sept): Kanu, Kajak, Tretboot, SUP, sogar eFoil. Keine Motorboote.",
    tip:"<b>Tipp:</b> reichlich kostenlose Parkplätze. Rechtzeitig zum Essen kommen – nach dem Mittag oft nur noch Snacks.",
    maps:M("Lac de Tolla Corse") },
  { kategorie:"Ausflüge", name:"Bootstour Sanguinaires bei Sonnenuntergang", info:"ca. 3 Std · 4,9 ★",
    text:"Vielleicht der romantischste Halbtagesausflug, Start direkt im Hafen von Porticcio. Vorbei an der Zitadelle Ajaccio zum Archipel, hinauf zum Leuchtturm mit 360°-Blick, Badepause im klaren Wasser. Zum Abschluss Apéritif mit korsischer Wurst, Käse und Rosé, während die Sonne die roten Felsen in Brand setzt.",
    maps:M("Port de Plaisance Porticcio") },
  { kategorie:"Ausflüge", name:"Große Bootstour: Piana, Scandola & Girolata", info:"Ganztag · 4,7–5,0 ★",
    text:"Das ganz große Korsika-Erlebnis: Calanche de Piana (UNESCO-Weltnaturerbe, rosa Granitfelsen, durch deren Spalten das Boot heranfährt), Naturschutzgebiet La Scandola und das nur per Boot erreichbare Fischerdorf Girolata. Eines der schönsten Naturerlebnisse der Insel.",
    maps:M("Calanche de Piana Corse") },

  { kategorie:"Sport", name:"Padel & Tennis · Terra Bella Country Club", info:"Porticcio",
    text:"Erste Adresse für Padel: zwei verglaste Courts mit Flutlicht (auch abends), eine Minute von Stränden und Restaurants. Entspannt, familiär, auf Wunsch Einzel- oder Gruppenstunden. Dazu zwei Sand- und ein Hartplatz für Tennis (täglich 8–22 Uhr).",
    tip:"<b>Tipp:</b> Platz buchen über ballejaune.com/club/tcterrabella oder +33 6 12 28 81 89.",
    link:"https://ballejaune.com/club/tcterrabella" },
  { kategorie:"Sport", name:"Tennis Club Ajaccio", info:"Ajaccio · 7 Tage/Woche · ~20 €/Std",
    text:"Stundenweise Platzmiete – ohne Mitgliedschaft oder Lizenz, ideal für Urlauber.",
    tip:"<b>Tipp:</b> Buchung über ballejaune.com/club/tcajaccio.",
    link:"https://ballejaune.com/club/tcajaccio" },
  { kategorie:"Sport", name:"Fahrrad- & E-Bike-Verleih", info:"Porticcio · ab ~25–30 €/Tag",
    text:"„Location de Vélo Porticcio – Rive Sud“ verleiht klassische und elektrische Mountainbikes (E-MTB ~60 km Reichweite), kostenlose Lieferung an der Ajaccio–Porticcio-Fähre (+33 6 03 78 43 67). Alternativ „Lucky Loc 2A“ nahe dem Fähranleger.",
    tip:"<b>Tipp:</b> beide auf Touren- und E-Bikes spezialisiert. Wer ein echtes Rennrad braucht, fragt vorab gezielt nach.",
    link:"tel:+33603784367" },
  { kategorie:"Sport", name:"Rennrad-Strecken ab Porticcio", info:"3 Klassiker",
    text:"(1) Küstentour Richtung Îles Sanguinaires – flache Postkarten-Strecke, ~35 km, Meerblick. (2) Bergauf zum Lac de Tolla durch das Prunelli-Tal (~38 km / 890 hm; große Variante ab Bastelica ~85 km / 2.050 hm). (3) Südküste Richtung Coti-Chiavari über Pietrosella und Isolella, ~50 km.",
    tip:"<b>Tipp:</b> GPS-Tracks auf Komoot, Strava oder Wikiloc. Die Küstentouren sind am einsteigerfreundlichsten." }
];

const KATEGORIEN = ["Programm","Restaurants","Strände","Ausflüge","Sport"];
let aktiv = "Programm";
const tabsEl=document.getElementById("tabs"), listEl=document.getElementById("list"),
      countEl=document.getElementById("count"), searchEl=document.getElementById("search");

KATEGORIEN.forEach(k=>{
  const b=document.createElement("button");
  b.className="tab"+(k==="Programm"?" active":""); b.textContent=k;
  b.onclick=()=>{aktiv=k;[...tabsEl.children].forEach(c=>c.classList.remove("active"));b.classList.add("active");render();};
  tabsEl.appendChild(b);
});

function icon(t){
  if(t==="map") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  if(t==="wa") return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.69 8.24-8.23 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43l-.48-.01c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
}

function cardHTML(d){
  return `
    <div class="card${d.sea?' sea':''}">
      <div class="top">
        <h3>${esc(d.name)}</h3>
        <span class="kicker">${esc(d.gruppe||d.kategorie)}</span>
      </div>
      ${d.info?`<div class="meta">${esc(d.info)}</div>`:""}
      <p>${esc(d.text)}</p>
      ${d.tip?`<div class="tip">${d.tip}</div>`:""}
      ${(d.maps||d.link)?`<div class="links">
        ${d.maps?`<a class="btn btn-map" href="${d.maps}" target="_blank" rel="noopener">${icon("map")} Auf Karte</a>`:""}
        ${d.link?`<a class="btn ${d.linkstyle==="whatsapp"?"btn-wa":"btn-link"}" href="${d.link}" target="_blank" rel="noopener">${icon(d.linkstyle==="whatsapp"?"wa":"link")} ${esc(d.linklabel||"Öffnen")}</a>`:""}
      </div>`:""}
    </div>`;
}

function render(){
  const q=searchEl.value.trim().toLowerCase();
  const treffer=DATEN.filter(d=>{
    const katOk=d.kategorie===aktiv;
    const txtOk=!q||(d.name+" "+(d.info||"")+" "+d.text+" "+(d.tip||"")+" "+d.kategorie+" "+(d.gruppe||"")).toLowerCase().includes(q);
    return katOk&&txtOk;
  });
  countEl.textContent=treffer.length===0?"":treffer.length+(treffer.length===1?" Eintrag":" Einträge");
  if(treffer.length===0){listEl.innerHTML='<div class="empty">Nichts gefunden.<br>Versuch ein anderes Wort oder eine andere Kategorie.</div>';return;}

  // Restaurants nach Mittags/Abends gruppieren, sonst einfache Liste
  if(aktiv==="Restaurants"){
    const reihenfolge=["Mittags","Abends"];
    let html="";
    reihenfolge.forEach(g=>{
      const teil=treffer.filter(d=>d.gruppe===g);
      if(teil.length){
        html+=`<div class="group">${g} essen</div>`+teil.map(cardHTML).join("");
      }
    });
    listEl.innerHTML=html;
  } else {
    listEl.innerHTML=treffer.map(cardHTML).join("");
  }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
searchEl.addEventListener("input",render);
render();
</script>
</body>
</html>
