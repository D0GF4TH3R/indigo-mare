<style>
  /* ===== NACHT (Dark) – Standard ===== */
  :root,
  :root[data-theme="dark"]{
    --paper:#10182b;          /* tiefes Nachtblau (Seitengrund unten) */
    --void:#0c1322;           /* Grundfarbe hinter dem Hintergrundbild */
    --ink:#eef1f6;            /* heller, warmer Text */
    --soft:#a8b2c6;           /* sekundärer Text, gedämpft */
    --line:rgba(200,210,230,.18); /* zarte helle Linien */
    --card-line:rgba(200,210,230,.14);
    --sage:#8fb0a8;           /* mintiges Grün (Palmen) */
    --sage-deep:#b9d2cb;
    --rose:#e0a99a;           /* warmes Rosé – Akzent (Kleider) */
    --rose-deep:#e9b6a6;
    --gold:#e8c878;           /* Lichterketten-Gold */
    --gold-hover:#f0d590;
    --on-gold:#1a2238;        /* Textfarbe auf goldenen Buttons */
    --sea:#7fb3c4;            /* mondhelles Meerblau */
    --shadow:0 4px 24px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.25);
    --glass:rgba(20,30,52,.62);
    --field:rgba(30,42,68,.7);    /* Suchfeld-Hintergrund */
    --placeholder:#8590a6;
    --tip-bg:rgba(232,200,120,.1);
    --controls-fade:rgba(16,24,43,.7); /* unterer Rand der Sticky-Leiste */
    /* Texte über dem Hintergrundbild */
    --title:#fbfcfe;
    --head:#f4f6fa;
    --ptext:#dce1ec;
    --date:#e8edf5;
    --place:#cdd6e4;
    --title-shadow:0 2px 18px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.6);
    --text-shadow-sm:0 1px 10px rgba(0,0,0,.5);
    /* Hintergrundbild + Verlauf nach unten */
    --bg-img:url('assets/bg.jpg');
    --fade0:rgba(12,19,34,0);
    --fade1:rgba(13,20,38,.45);
    --fade2:rgba(14,22,42,.88);
  }

  /* ===== TAG (Light) – aus dem Tag-Aquarell abgeleitet ===== */
  :root[data-theme="light"]{
    --paper:#f8efe0;          /* warmes Aquarell-Papier / Sand */
    --void:#ece0c9;           /* Sandton hinter dem Hintergrundbild */
    --ink:#33405a;            /* tiefes See-Indigo als Fließtext */
    --soft:#71798f;           /* gedämpfter Sekundärtext */
    --line:rgba(45,60,95,.16);
    --card-line:rgba(45,60,95,.12);
    --sage:#5d8c7c;
    --sage-deep:#3c6c5c;      /* Palmengrün, dunkler für Kontrast */
    --rose:#c47e64;
    --rose-deep:#b15f47;      /* Terrakotta-Akzent */
    --gold:#c2902f;           /* tieferes Ocker-Gold für hellen Grund */
    --gold-hover:#d3a23f;
    --on-gold:#fff8ea;        /* helle Schrift auf Ocker-Buttons */
    --sea:#2f93b8;            /* kräftigeres Türkis (Meer) */
    --shadow:0 6px 22px rgba(58,72,110,.14), 0 1px 4px rgba(58,72,110,.1);
    --glass:rgba(255,253,248,.66);
    --field:rgba(255,253,248,.8);
    --placeholder:#9aa0ad;
    --tip-bg:rgba(194,144,47,.13);
    --controls-fade:rgba(248,239,224,.7);
    --title:#243049;
    --head:#283450;
    --ptext:#3f4a63;
    --date:#2b3954;
    --place:#475670;
    --title-shadow:0 1px 12px rgba(255,255,255,.75), 0 1px 2px rgba(255,255,255,.6);
    --text-shadow-sm:0 1px 8px rgba(255,255,255,.7);
    --bg-img:url('assets/bg-day.jpg');
    --fade0:rgba(248,239,224,0);
    --fade1:rgba(248,239,224,.42);
    --fade2:rgba(248,239,224,.9);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'EB Garamond',Georgia,serif;
    color:var(--ink);line-height:1.55;font-size:17px;
    min-height:100vh;
    background:var(--void);
    transition:background-color .45s ease, color .45s ease;
  }

  /* ---------- fixer Aquarell-Hintergrund ---------- */
  .bg{
    position:fixed;inset:0;z-index:-2;
    background-image:var(--bg-img);
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    background-color:var(--void);
    transform:scale(1.04);transform-origin:center top;
  }
  /* animiertes Hintergrundvideo (über dem Standbild, unter dem Verlauf) */
  .bgvid{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center top;
    opacity:0;transition:opacity .7s ease;pointer-events:none;
  }
  .bgvid.playing{opacity:1}
  /* sanfter Verlauf, damit Inhalt unten lesbar bleibt */
  .bg::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,
      var(--fade0) 0%,
      var(--fade0) 30%,
      var(--fade1) 50%,
      var(--fade2) 68%,
      var(--paper) 85%);
  }

  /* ---------- Titel im Himmel ---------- */
  .hero{
    text-align:center;
    padding:clamp(40px,11vh,90px) 24px clamp(20px,5vh,40px);
    padding-top:calc(env(safe-area-inset-top,0) + clamp(40px,11vh,90px));
  }
  .hero .eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-size:clamp(17px,4.5vw,21px);
    letter-spacing:.04em;color:var(--gold);
    margin-bottom:6px;
    text-shadow:var(--text-shadow-sm);
  }
  .hero h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;font-size:clamp(46px,15vw,78px);
    line-height:.96;letter-spacing:.005em;color:var(--title);
    text-shadow:var(--title-shadow);
  }
  .hero .rule{
    width:46px;height:1px;background:var(--gold);
    margin:18px auto 14px;opacity:.8;
  }
  .hero .date{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(16px,4.6vw,20px);letter-spacing:.16em;
    text-transform:uppercase;color:var(--date);
    text-shadow:var(--text-shadow-sm);
  }
  .hero .place{
    font-style:italic;font-size:15px;color:var(--place);margin-top:6px;
    text-shadow:var(--text-shadow-sm);
  }

  /* ---------- Steuerung ---------- */
  .controls{
    position:sticky;top:0;z-index:20;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    background:linear-gradient(180deg,var(--paper) 60%,var(--controls-fade));
    padding:14px 18px 8px;
    border-bottom:1px solid var(--line);
  }

  /* ---------- Tag/Nacht-Umschalter ---------- */
  .themebtn{
    position:fixed;z-index:30;
    top:calc(env(safe-area-inset-top,0) + 14px);right:14px;
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:var(--glass);color:var(--ink);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, background-color .45s ease, color .45s ease, border-color .45s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .themebtn:hover{transform:scale(1.06)}
  .themebtn:active{transform:scale(.94)}
  .themebtn svg{width:21px;height:21px}
  .searchwrap{position:relative;max-width:620px;margin:0 auto}
  .searchwrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--soft)}
  #search{
    width:100%;font-family:'EB Garamond',serif;font-size:17px;
    padding:13px 16px 13px 44px;
    border:1px solid var(--line);border-radius:12px;
    background:var(--field);color:var(--ink);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  #search::placeholder{color:var(--placeholder);font-style:italic}
  #search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,200,120,.16)}

  .tabs{display:flex;gap:4px;overflow-x:auto;padding:11px 18px 3px 2px;max-width:620px;margin:0 auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;font-family:'EB Garamond',serif;font-size:16px;
    padding:7px 14px 9px;cursor:pointer;white-space:nowrap;
    background:none;border:none;color:var(--soft);
    border-bottom:2px solid transparent;transition:.18s;letter-spacing:.01em;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:500}

  /* ---------- Liste ---------- */
  main{max-width:620px;margin:0 auto;padding:14px 18px 8px;position:relative;z-index:1}
  .count{font-style:italic;font-size:14.5px;color:var(--soft);padding:2px 2px 14px}
  .group{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:22px;color:var(--sage-deep);
    margin:6px 4px 12px;display:flex;align-items:center;gap:12px;
    scroll-margin-top:140px;
  }
  .group::after{content:"";flex:1;height:1px;background:var(--line)}

  .card{
    background:var(--glass);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    border:1px solid var(--card-line);
    border-radius:16px;box-shadow:var(--shadow);
    padding:20px 20px 18px;margin-bottom:14px;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--gold);opacity:.7;
  }
  .card.sea::before{background:var(--sea)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .card h3{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:24px;line-height:1.12;letter-spacing:.005em;color:var(--head);
  }
  .kicker{
    flex:0 0 auto;font-family:'EB Garamond',serif;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--soft);
    padding-top:5px;
  }
  .card .meta{
    font-style:italic;font-size:15px;color:var(--rose-deep);margin-top:3px;
  }
  .card p{font-size:16.5px;color:var(--ptext);margin-top:10px;line-height:1.5}
  .card .tip{
    font-size:14.5px;color:var(--soft);margin-top:11px;
    padding:9px 13px;background:var(--tip-bg);border-radius:9px;
  }
  .card .tip b{color:var(--gold);font-weight:600}
  .card .links{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
  .btn{
    font-family:'EB Garamond',serif;font-size:15px;font-weight:500;
    text-decoration:none;padding:9px 16px;border-radius:10px;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;letter-spacing:.01em;
  }
  .btn-map{background:var(--gold);color:var(--on-gold)}
  .btn-map:hover{background:var(--gold-hover)}
  .btn-link{background:rgba(143,176,168,.16);color:var(--sage-deep);border:1px solid rgba(143,176,168,.3)}
  .btn-link:hover{background:rgba(143,176,168,.26)}
  .btn-wa{background:#3f9d77;color:#fdfcf8}
  .btn-wa:hover{background:#46ad84}
  .btn-wa svg{width:17px;height:17px}
  .btn svg{width:16px;height:16px}

  .empty{text-align:center;color:var(--soft);font-style:italic;padding:54px 20px;font-size:17px}

  footer{
    text-align:center;color:var(--soft);font-size:14px;
    padding:30px 24px;line-height:1.8;position:relative;z-index:1;
  }
  footer .fleur{color:var(--gold);font-size:18px;display:block;margin-bottom:6px}
  footer .names{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--sage-deep)}

  /* ---------- Easter Egg ---------- */
  .hero h1{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #egg{
    position:fixed;inset:0;z-index:1000;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:rgba(6,10,20,.94);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    animation:eggFade .25s ease;
  }
  #egg.on{display:flex}
  #egg img{
    width:min(86vw,520px);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #egg .egg-cap{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:26px;color:var(--gold);letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  @keyframes eggFade{from{opacity:0}to{opacity:1}}
</style>

<!-- Theme früh setzen: Systemstandard (Tag/Nacht) übernehmen, bevor die Seite rendert -->
<script>
(function(){
  try{
    var hell = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.dataset.theme = hell ? 'light' : 'dark';
  }catch(e){ document.documentElement.dataset.theme = 'dark'; }
})();
</script>

const tabsEl=document.getElementById("tabs"), listEl=document.getElementById("list"),

KATEGORIEN.forEach(k=>{
  const b=document.createElement("button");
  b.className="tab"+(k==="Programm"?" active":""); b.textContent=k;
  b.onclick=()=>{aktiv=k;[...tabsEl.children].forEach(c=>c.classList.remove("active"));b.classList.add("active");render();};
  tabsEl.appendChild(b);
});

function cardHTML(d){
  return `
    <div class="card${d.sea?' sea':''}">
      <div class="top">
        <h3>${esc(d.name)}</h3>
        <span class="kicker">${esc(d.gruppe||d.kategorie)}</span>
      </div>
      ${d.info?`<div class="meta">${esc(d.info)}</div>`:""}
      <p>${esc(d.text)}</p>
      ${d.tip?`<div class="tip">${d.tip}</div>`:""}
      ${(d.maps||d.link||d.links)?`<div class="links">
        ${d.maps?`<a class="btn btn-map" href="${d.maps}" target="_blank" rel="noopener">${icon("map")} Auf Karte</a>`:""}
        ${d.link?`<a class="btn ${d.linkstyle==="whatsapp"?"btn-wa":"btn-link"}" href="${d.link}" target="_blank" rel="noopener">${icon(d.linkstyle==="whatsapp"?"wa":"link")} ${esc(d.linklabel||"Öffnen")}</a>`:""}
        ${d.links?d.links.map(l=>{
          const wa=l.style==="whatsapp";
          const ic=wa?"wa":(l.href.startsWith("tel:")?"tel":(l.href.startsWith("mailto:")?"mail":"link"));
          return `<a class="btn ${wa?"btn-wa":"btn-link"}" href="${l.href}" target="_blank" rel="noopener">${icon(ic)} ${esc(l.label)}</a>`;
        }).join(""):""}
      </div>`:""}
    </div>`;
}

function render(){
  const q=searchEl.value.trim().toLowerCase();
  const treffer=DATEN.filter(d=>{
    const txtOk=!q||(d.name+" "+(d.info||"")+" "+d.text+" "+(d.tip||"")+" "+d.kategorie+" "+(d.gruppe||"")).toLowerCase().includes(q);
    // Bei aktiver Suche über ALLE Kategorien suchen, sonst nur aktiven Tab zeigen
    const katOk = q ? true : (d.kategorie===aktiv);
    return katOk&&txtOk;
  });
  countEl.textContent=treffer.length===0?"":treffer.length+(treffer.length===1?" Eintrag":" Einträge");
  if(treffer.length===0){listEl.innerHTML='<div class="empty">Nichts gefunden.<br>Versuch ein anderes Wort oder eine andere Kategorie.</div>';return;}

  // Kategorien mit Untergruppen: Zwischenüberschriften statt flacher Liste
  const GRUPPEN = {
    "Restaurants": ["Mittags","Abends","Bars & Beach Clubs"],
    "Aktivitäten": ["Sport vor Ort","Auf dem Wasser","Natur & Abenteuer","Wein & Kultur"]
  };
  if(GRUPPEN[aktiv] && !q){
    let html="";
    GRUPPEN[aktiv].forEach(g=>{
      const teil=treffer.filter(d=>d.gruppe===g);
      if(teil.length){
        const titel = (g==="Mittags"||g==="Abends") ? g+" essen" : g;
        html+=`<div class="group">${titel}</div>`+teil.map(cardHTML).join("");
      }
    });
    listEl.innerHTML=html;
  } else {
    listEl.innerHTML=treffer.map(cardHTML).join("");
  }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
searchEl.addEventListener("input",render);
render();

/* ---------- Easter Egg: 10× schnell auf den Titel tippen ---------- */
(function(){
  const titel=document.querySelector(".hero h1");
  const egg=document.getElementById("egg");
  const gif=document.getElementById("eggGif");
  const GIF_SRC="assets/dance.gif";
  let taps=0, last=0, playing=false;

  titel.addEventListener("click",()=>{
    if(playing) return;
    const now=Date.now();
    taps = (now-last < 600) ? taps+1 : 1;  // Kette nur bei schnellen Taps
    last=now;
    if(taps>=10){ taps=0; starteEgg(); }
  });

  function starteEgg(){
    playing=true;
    // GIF erst jetzt laden, dann sauber 3× von vorn abspielen
    let runden=0;
    const EINMAL=2500; // ungefähre Laufzeit einer GIF-Runde in ms
    gif.src=GIF_SRC;
    egg.classList.add("on");
    function naechste(){
      runden++;
      if(runden>=3){ ende(); return; }
      // Neustart der Animation durch Neuzuweisung der Quelle
      gif.src=""; gif.src=GIF_SRC;
      timer=setTimeout(naechste,EINMAL);
    }
    let timer=setTimeout(naechste,EINMAL);
    function ende(){
      egg.classList.remove("on");
      gif.src="";
      playing=false;
    }
    // Sicherheitsnetz: per Tap aufs Overlay sofort schließen
    egg.onclick=()=>{ clearTimeout(timer); ende(); };
  }
})();

/* ---------- Tag/Nacht-Umschalter ----------
   Standard ist immer der Systemstandard des Geräts (im <head> gesetzt).
   Der Button überschreibt das nur für die laufende Sitzung – ohne Speicher,
   beim Neuladen gilt wieder der Systemstandard (so will es das Projekt). */
(function(){
  const root=document.documentElement;
  const btn=document.getElementById("themeBtn");
  const meta=document.querySelector('meta[name="theme-color"]');
  const mq=window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  const FARBE={dark:"#10182b", light:"#f8efe0"};
  const SONNE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.6M12 18.4V21M3 12h2.6M18.4 12H21M5.1 5.1l1.85 1.85M17.05 17.05l1.85 1.85M18.9 5.1l-1.85 1.85M6.95 17.05 5.1 18.9"/></svg>';
  const MOND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  // Animiertes Hintergrundvideo (nur das aktive laden; bei „Bewegung reduzieren" gar nicht)
  const vid=document.getElementById("bgVideo");
  const ruhig=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const VIDEO={dark:"assets/bg.mp4", light:"assets/bg-day.mp4"};
  function videoSetzen(theme){
    if(!vid || ruhig) return;                 // Sparmodus/Reduce-Motion → nur Standbild
    const src=VIDEO[theme];
    if(vid.getAttribute("src")===src) return; // schon geladen
    vid.classList.remove("playing");
    vid.src=src; vid.muted=true; vid.load();
    const p=vid.play();
    if(p && p.catch) p.catch(()=>{});         // Autoplay blockiert → Standbild bleibt sichtbar
  }
  if(vid) vid.addEventListener("playing", ()=> vid.classList.add("playing"));

  let manuell=false; // sobald der Nutzer selbst umschaltet, folgen wir dem System nicht mehr

  function anwenden(theme){
    root.dataset.theme=theme;
    if(meta) meta.setAttribute("content", FARBE[theme]);
    videoSetzen(theme);
    // Icon zeigt die AKTUELLE Ansicht: Sonne = Tag, Mond = Nacht
    btn.innerHTML = theme==="light" ? SONNE : MOND;
    btn.setAttribute("aria-label", theme==="light" ? "Zur Nacht-Ansicht wechseln" : "Zur Tag-Ansicht wechseln");
  }
  anwenden(root.dataset.theme || "dark");

  btn.addEventListener("click", ()=>{
    manuell=true;
    anwenden(root.dataset.theme==="light" ? "dark" : "light");
  });
  // Wechselt das Gerät tagsüber Hell/Dunkel, ziehen wir mit – außer der Nutzer hat manuell umgestellt
  if(mq){
    const folge=e=>{ if(!manuell) anwenden(e.matches ? "light" : "dark"); };
    mq.addEventListener ? mq.addEventListener("change",folge) : mq.addListener(folge);
  }
})();
</script>
